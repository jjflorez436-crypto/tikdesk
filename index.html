<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Rinconcito</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1a1030; --card-bg: #120d24; --accent: #5b5ef4; --accent2: #7c7fff;
      --border: #2e2550; --text: #ffffff; --muted: #8888bb; --banner-bg: #0f0a22;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }

    .ticker-wrap { background: var(--banner-bg); border-bottom: 1px solid var(--border); padding: 12px 0; white-space: nowrap; overflow: hidden; }
    .ticker-track { display: inline-block; animation: ticker 22s linear infinite; }
    .ticker-track span { font-family: 'Barlow Condensed', sans-serif; font-size: 1.3rem; font-weight: 900; letter-spacing: 0.18em; color: var(--accent2); padding: 0 35px; }
    @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    .container { max-width: 480px; margin: 0 auto; padding: 20px 16px 100px; }
    .entry { margin-bottom: 22px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--card-bg); }
    .entry-img-wrap { width: 100%; aspect-ratio: 4/3; overflow: hidden; background: #1e1640; cursor: pointer; }
    .entry-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
    .entry-img-wrap:hover img { transform: scale(1.05); }

    .entry-link-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--border); text-decoration: none; color: var(--accent2); }
    .entry-link-row:hover { background: rgba(91,94,244,0.1); }
    .entry-thumb { width: 46px; height: 46px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }

    .ad-container { margin: 20px 0; text-align: center; padding: 10px 0; border-top: 1px dashed #3a2f6a; border-bottom: 1px dashed #3a2f6a; }
    .vertical-ad { margin: 15px auto; max-width: 160px; }

    .admin-btn { position: fixed; bottom: 20px; right: 20px; background: #5b5ef4; color: white; border: none; border-radius: 50%; width: 60px; height: 60px; font-size: 1.6rem; box-shadow: 0 5px 20px rgba(0,0,0,0.5); z-index: 1000; cursor: pointer; }
  </style>
</head>
<body>

<div class="ticker-wrap">
  <div class="ticker-track">
    <span>EL RINCONCITO</span><span>EL RINCONCITO</span><span>EL RINCONCITO</span>
  </div>
</div>

<div class="container">

  <!-- ANUNCIO SUPERIOR -->
  <div class="ad-container">
    <script async="async" data-cfasync="false" src="https://peacefullymotive.com/dfbb47bfcdceb75591dd3b9a1d2f2449/invoke.js"></script>
    <div id="container-dfbb47bfcdceb75591dd3b9a1d2f2449"></div>
  </div>

  <div id="entries"></div>

  <!-- ANUNCIO VERTICAL -->
  <div class="ad-container">
    <div class="vertical-ad">
      <script>
        atOptions = {'key':'96e8e51e92d0edf6bd3f0a2dd004f22c','format':'iframe','height':300,'width':160,'params':{}};
      </script>
      <script src="https://peacefullymotive.com/96e8e51e92d0edf6bd3f0a2dd004f22c/invoke.js"></script>
    </div>
  </div>
</div>

<button class="admin-btn" id="adminBtn">✏️</button>

<script>
  const links = [
    "https://jonyflixx.blogspot.com/2026/05/estoy-paso-en-segundos-pero-paso.html",
    "https://jonyflixx.blogspot.com/2026/05/blog-post.html",
    "https://jonyflixx.blogspot.com/2026/05/blog-post_9.html",
    "https://jonyflixx.blogspot.com/2026/05/blog-post_25.html",
    "https://jonyflixx.blogspot.com/2026/05/blog-post_81.html",
    "https://jonyflixx.blogspot.com/2026/05/blog-post_37.html",
    "https://jonyflixx.blogspot.com/2026/05/blog-post_48.html",
    "https://jonyflixx.blogspot.com/2026/05/se-pudo-hacer-posible.html",
    "https://jonyflixx.blogspot.com/2026/05/lo-hizo-de-nuevo-y-lo-logro.html",
    "https://jonyflixx.blogspot.com/2026/05/lo-logro-por-que-insistio.html"
  ];

  const imageNames = [
    "IMG_1390.jpeg", "IMG_1389.jpeg", "IMG_1388.jpeg", "IMG_1387.jpeg",
    "IMG_1386.jpeg", "IMG_1385.jpeg", "IMG_1384.jpeg", "IMG_1383.jpeg",
    "IMG_1382.jpeg", "IMG_1381.jpeg"
  ];

  let isAdminMode = false;
  let currentIndex = null;
  let tempImageData = null;

  function getData() { try { return JSON.parse(localStorage.getItem('rinconcito_data') || '{}'); } catch { return {}; }}
  function saveData(d) { localStorage.setItem('rinconcito_data', JSON.stringify(d)); }

  function renderEntries() {
    const data = getData();
    const container = document.getElementById('entries');
    container.innerHTML = '';

    for (let i = 0; i < 10; i++) {
      const entry = data[i] || {};
      const imgSrc = entry.image || `https://raw.githubusercontent.com/jjflorez436-crypto/tikdesk/main/${imageNames[i]}`;
      const url = entry.url || links[i];

      const div = document.createElement('div');
      div.className = 'entry';
      div.innerHTML = `
        <div class="entry-img-wrap" data-index="${i}">
          <img src="${imgSrc}" alt="Entrada ${i+1}">
        </div>
        <a class="entry-link-row" href="${url}" target="_blank" rel="noopener">
          <img class="entry-thumb" src="${imgSrc}">
          <span class="entry-url">ENTRADA ${i+1}</span>
          <span class="entry-arrow">→</span>
        </a>
      `;

      div.querySelector('.entry-img-wrap').addEventListener('click', () => {
        if (isAdminMode) openEdit(i);
        else window.open(url, '_blank');
      });

      container.appendChild(div);
    }
  }

  document.getElementById('adminBtn').addEventListener('click', () => {
    isAdminMode = !isAdminMode;
    const btn = document.getElementById('adminBtn');
    btn.textContent = isAdminMode ? '👁️' : '✏️';
    btn.style.background = isAdminMode ? '#ff2d55' : '#5b5ef4';
  });

  renderEntries();
</script>
</body>
</html
